id = "C-29"
short = "ASSERT THE ARTIFACT, NOT THE REPORT"
# 2026-08-11 (late): this key was `detail`. corrections.py line 121 renders c.get("rule", ""),
# so C-29 printed its heading and then NOTHING. The newest correction in the C.O.S., and the one
# that says a report of success is evidence about the reporter, was itself silently not printing.
# Found by rewriting TidyUP2's schema check, which had been reporting all 29 entries as "odd"
# against "whichever entry happens to have the most keys" - noise that hid the single real fault.
rule = """Exit codes, run headers, tool prose and handoff entries all fail in the same direction:
TOWARD SUCCESS. A report of success is evidence about the reporter, not about the artifact.

Hit FOUR times in one session, 2026-08-11, each in a different disguise:
  1. BU.MD said the Codex policy was 'set and verified by re-read'. Four of five keys were absent.
  2. `codex exec` returned exit=0 while the file it was asked to write did not exist.
  3. A run header printed `sandbox: read-only` on the one invocation that DID write successfully.
  4. rail_check and bts_kdash_feed exited 0 while crashing, and the Windows scheduler recorded
     `Last Result: 0` for a task that produced no file for five days.

⇒ It is S-131 generalized. There, a bundle named RECORD_ALL.txt held 51 of 74 documents and two paid
bench opinions ruled on the short set, because reading the name felt like verifying it. The richer
and more specific the report, the LESS likely anyone is to check it - an itemized list with the
verification method stated is the most credible thing on the page and the least tested."""
count = 2
first = 2026-08-11
last = 2026-08-12
status = "OPEN"
occurrences = [
  "2026-08-11 - four instances in one plumbing session: a handoff claiming five config keys were 'verified by re-read' when host-side the file held one; `codex exec` exit=0 with no artifact on disk; a run header reporting read-only on the single variant that wrote; and two monitors exiting 0 while dying on UnicodeEncodeError, with the native scheduler reporting Last Result 0 for five consecutive days of producing nothing. In every case the artifact was one cheap check away and nobody made it.",
  "2026-08-12 - THE REPORT THAT LIED WAS A STATUS STRING, AND THERE WERE THREE OF THEM. rails.toml said `R2 Publish Nightly` -> writes = 'NOTHING', state = 'FIRES BUT LEAVES NO EVIDENCE'; `BTS Publish Watch` -> 'RUNS EVERY 60s AND LOGS NOTHING'; `BTS Rail Check` -> measured = 2026-07-30. All three were TRUE WHEN WRITTEN and false within days. PUBLISH.log holds dated OK lines for TEN of the last thirteen nights, and rail_check writes a report every night. KDash renders those strings verbatim, so the dashboard showed three working monitors as RED or MEASURES-NOTHING for thirteen days - and a red light nobody can clear gets ignored alongside the real ones. The artifact (a log file with dates in it) was one `cat` away for thirteen days. ⇒ A STATUS STRING IS A REPORT. It ages exactly like an exit code and nothing re-reads it.",
]
mechanism = """STANDING CHECK, and it is cheap enough to be unconditional: NAME THE ARTIFACT, THEN
STAT IT. Before any claim that something was written, applied, sent or fixed - `dir` the file, count
the keys, grep the value, compare the byte count. Put the NUMBER in the report.

'Four of five keys present' and '138 bytes at 21:29' are sentences that cannot be written without
looking. 'Verified by re-read' is a sentence that can.

⚠ AND EXIT 0 IS NOT AN ARTIFACT. A process can succeed at running while failing at its purpose.
Where a job is supposed to produce a file, the job's success condition IS the file."""

[[correction]]
id = "C-30"
short = "A CHECK THAT CRIES WOLF IS NOT EVIDENCE EITHER"
rule = """CLAUDE.md already says: a check reporting a defect in a file you just touched is not
evidence that you broke it. THE SAME IS TRUE OF A FILE YOU DID NOT TOUCH, and that half was never
written down.

An instrument's output is evidence about THE INSTRUMENT until the artifact has been checked
host-side. That holds in both directions. C-29 is the good-news half - exit codes, headers and
prose all fail toward success. THIS is the bad-news half, and it is harder, because a RED reads as
diligence. Nobody argues with a check that found something. So a false RED gets acted on, and the
action is an edit to a healthy file."""
count = 1
first = 2026-08-12
last = 2026-08-12
status = "OPEN"
occurrences = [
  "2026-08-12 - FOUR FALSE ALARMS IN ONE SESSION, each persuasive, each pointing at a healthy file. (1) verify_pointers closed the whole repo RED over two lines of English prose in SCARS.md, with failed=0 the entire time. (2) The C.O.S. schema check flagged 29 of 29 entries by comparing each against whichever entry happened to have the most keys - and the noise hid the ONE real fault. (3) A C-29 assertion reported a correction had not landed, because it sliced 400 characters after the key and comment lines had pushed the key past the window. (4) A truncation control flagged SIX healthy JSON files and declared TOOLS_REGISTRY.json unreadable, killing a whole section of the sweep, because read_text() does CRLF->LF translation on Windows so a healthy CRLF file reads back shorter than stat. In all four the CHECK was wrong and the FILE was fine. Each was confirmed host-side before anything was changed, which is the only reason four healthy files were not repaired into damage.",
]
mechanism = """STANDING, and it is one sentence: BEFORE ACTING ON A RED, CONFIRM THE ARTIFACT
HOST-SIDE - and confirm it especially when the check is one you wrote or edited in this session.

Three concrete forms, all paid for on 2026-08-12:
  1. A verifier modified this session is the LEAST trustworthy thing in the room, not the most.
  2. A finding must print the PATH, never the basename. Twenty minutes went into a file that was
     already correct because a finding said `00_TOOLS_INDEX.md:52` and there are two of those.
  3. A check that can never close green gets muted, so an exemption is as much a part of a checker
     as its rule - and every exemption needs its own negative control proving the check still
     fires inside the exempted region."""

[[correction]]
id = "C-31"
short = "A STRUCTURAL CLAIM IS NOT A MEASUREMENT"
rule = """A sentence about how something WORKS - which account holds which key, what feeds what,
which lane is the fallback - is not a measurement, and NO automated check in this mesh can verify
one. verify_pointers resolves paths. tidyup2_full recounts numbers. maint_sweep ages constants.
None of them can tell whether a structural assertion is true.

So a structural claim must NOT be written in the same bold, dated, confident register as a measured
fact. Mark it [U] until the person who built the thing confirms it, and record WHO confirmed it.

And when a human explains an architecture: WRITE IT DOWN IN THAT TURN, verbatim, attributed. That
explanation is the most perishable artifact in the session - the session ends, and whatever reached
disk becomes the truth, correct or not."""
count = 1
first = 2026-08-12
last = 2026-08-12
status = "OPEN"
occurrences = [
  "2026-08-12 - rails.toml and BU.MD both asserted in bold, dated, as fact: 'joanna.bbf HOLDS THE ONLY GOOGLE API KEY THAT EXISTS.' FALSE - joanna is the CREDIT key (Vertex, the $300) and keith.bbf holds keys made for the AI-Studio DAILY FREE CREDITS. The claim conflated the key with the credit, and the evidence contradicting it was on disk the entire time (.secrets\\gemini_keys-all but.txt names projects/475026348209, a keith.bbf project). It steered the October plan, the Needs-Keith list and the JDX concentration argument, and produced a repeated instruction to CREATE a key that already existed. Keith: 'You should know all of this, you set it up with me.' He is right - and the session that knew it ended, leaving only the wrong version on disk.",
]
mechanism = """NONE YET. Candidate, and it is cheap: any claim of the form 'X is the only Y' or
'X holds Y' or 'A feeds B' carries conf = "U" plus a `confirmed_by` field naming a human and a date,
until someone who built it says otherwise. The instruments cannot help here - this one is enforced
by FORMAT, so that a structural claim never LOOKS like a measured one."""

[[correction]]
id = "C-32"
short = "A PARTY'S DOCUMENT IS AN ADMISSION ONLY WHEN IT HURTS THE AUTHOR"
rule = '''The evidentiary direction of a document is not a property of the document. An opponent's
own record is an ADMISSION when it damages the opponent; it proves nothing when it helps him, because
then it is only his assertion, written down. Before citing an opponent's document as proof of a fact
that BENEFITS the opponent, stop and ask who carries the burden on that issue.'''
mechanism = '''Whenever an opponent's own document is about to be treated as settling a fact, name
the party who bears the burden of proof on that fact FIRST. If it is the opponent, their document
does not discharge it.'''
occurrences = '''2026-08-15 - Cowork told Keith he did not need proof a claimed 1,500 dollar payment
had cleared, because Abraxas own statement of account showed the credit. Backwards: payment is an
AFFIRMATIVE DEFENSE and the defendant pleads and proves it. Keith: No, they do. And they do not have
it. Verified after correction: their RFP 10 response of 2026-03-12 promised bank statements and never
supplemented across 156 days, and their production holds no bank statement, card statement,
authorization code or transaction record.'''
first = 2026-08-15
last = 2026-08-15
count = 1
status = "OPEN"

[[correction]]
id = "C-33"
short = "A RULE THAT COMPELS DISCLOSURE MAY BE A DELIVERY MECHANISM, NOT A THREAT"
rule = '''Before designing defensively around a rule that forces production or disclosure, ask what
that rule would DELIVER if invoked. A writing composed entirely of the opponent's own documents, with
nothing of ours in it, turns compelled production into pre-authenticated introduction of our own
chronology by the adversary.'''
mechanism = '''Two tests on any such instrument. ONE: does it contain any sentence of ours? If yes,
cut it - one line naming what they had failed to produce was removed precisely because it handed
them a cure deadline. TWO: does the title LURE or merely avoid alarming? Neutral titles get ignored,
which is a failure mode when the object is to be taken.'''
occurrences = '''2026-08-15 - Cowork spent three exchanges defending against 12 O.S. 2612 production
of a document Keith intended to carry into a deposition, and quarantined it into a DO NOT CARRY IN
folder. Keith: You are over reacting. And: Understood correctly, it is an opportunity, not a pitfall.
Keith also supplied the design spec - A Trojan horse. A poisoned pill. Nothing useful, all damaging
and things they have already - and the title, IMPORTANT: Abraxas Case notes for the Plaintiff, after
Cowork proposed the ignorable TIMELINE.'''
first = 2026-08-15
last = 2026-08-15
count = 1
status = "OPEN"

[[correction]]
id = "C-34"
short = "A VERIFICATION ARTIFACT THAT RECORDS NO METHOD IS NOT A VERIFICATION"
rule = '''A verification must state, in itself, WHAT it counted and HOW. Otherwise its numbers can be
neither reproduced nor refuted, and a later recount that disagrees leaves no way to tell which run
was wrong. Record the EXPECTED anomalies too, or a benign artifact reads as corruption to whoever
checks next.'''
mechanism = '''Every verification writes a report containing its own method, its counts, and per-file
hashes. See V:\Ai\Legal\WARGAME\verify_record.py, which does this and passed 77/77/77 on 2026-08-15.'''
occurrences = '''2026-08-15 - RECORD_VERIFIED_2026-08-15.txt was treated all session as a
verification report. It is the BUNDLE ITSELF and recorded no method, so its figure of 1,788,806
bytes could not be reproduced; a recount produced a different number and there was no way to
adjudicate. Same family as S-118. The benign anomaly that read as corruption: the bundle is about
29.6 KB SMALLER than the sum of its members, which is CRLF to LF normalization at build time.'''
first = 2026-08-15
last = 2026-08-15
count = 1
status = "OPEN"

[[correction]]
id = "C-35"
short = "REFLEXIVE EXONERATION - SOFTENING AN ADVERSE FINDING ABOUT A PROFESSIONAL"
rule = '''When a finding is adverse to someone in a trusted role - counsel, a physician, a vendor, a
colleague - do not construct a justification for them from inference. State what is verified, name
what is unknown, and identify the ONE document that would settle it. A charitable reading offered in
place of a check is not fairness; it is an unverified claim wearing fairness as a costume.'''
mechanism = '''Before writing any sentence of the form "they probably had a good reason", ask: what
record would confirm or refute that, and can I get it right now? If yes, get it. If no, say the
reason is unknown.'''
occurrences = '''2026-08-15 - On finding that Keith's 2025 petition omitted any count for his labor,
Cowork first called it a significant omission, then one message later reasoned from a statute of
limitations inference that counsel had probably made the correct call, and told Keith so. Keith:
But you are whitewashing it. He was right - the justification was inferred, not checked. The OSCN
docket for CJ-2023-257, a free public record, then showed the labor WAS pleaded in 2023 as
FAILURE TO PAY FOR SERVICES RENDERED, that the case was dismissed for failure to prosecute, and
that the 2025 refiling dropped the count. The exonerating story was wrong in every part, and the
document that disproved it took four minutes to pull.'''
first = 2026-08-15
last = 2026-08-15
count = 1
status = "OPEN"


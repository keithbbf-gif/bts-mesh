# C.O.S. — THE CARRY-OVER SYSTEM. Corrections, with weight.
#
# Keith, 2026-08-02: "Corrections, in particular, must be carried over. Repeated correction must
# increase in weight/attention, even across sessions. We are thereby training the Ai BY PROXY, not
# through model coefficients, but through training the CarryOverSystem. The C.O.S. — a critical
# component of my advanced Ai system."
#
# WHY THIS FILE EXISTS AND WHY IT IS NOT JUST MORE PROSE IN CLAUDE.md
#   Nothing Keith says changes the model. Praise, correction, instruction — all context, none of it
#   training. The ONLY thing that crosses a session boundary is what is on disk. So the carry-over
#   layer IS the training signal, and it has to behave like one:
#
#     A CORRECTION MADE FOUR TIMES MUST NOT LOOK LIKE A CORRECTION MADE ONCE.
#
#   CLAUDE.md cannot do that. It is a flat document; everything in it shouts equally, so nothing
#   does. This file COUNTS. Repeats raise weight, weight raises position and volume at BootUP, and
#   a correction that keeps recurring keeps getting louder until it stops recurring.
#
# THE FIELDS
#   id          stable. Never renumbered — history is the point.
#   short       what to call it out loud. A named failure mode is far harder to walk into.
#   rule        the correction, in Keith's terms where possible.
#   count       how many SEPARATE times Keith has had to say it. THE WEIGHT DRIVER.
#   first/last  dates. Recency breaks ties between equal counts.
#   occurrences one line per time it was needed, with what triggered it. The evidence for count.
#   status      OPEN = still recurring · HOLDING = written down, not yet re-tested · CLOSED = a
#               control now enforces it and the control has been shown to fire.
#
# 🔴 THE ESCALATION RULE
#   count >= 3  ->  BootUP prints it FIRST, in full, before the task list. It is not a footnote.
#   count >= 4  ->  Cowork must state, in its first reply of the session, how it will avoid it
#                   TODAY — specifically, not as a general intention.
#   A correction only moves to CLOSED when a MECHANISM enforces it, not when Cowork agrees with it.
#   Agreement is what produced counts 2, 3 and 4.

schema = 1
updated = 2026-08-11


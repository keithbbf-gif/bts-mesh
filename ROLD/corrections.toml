[[correction]]
id = "C-37"
short = "UNASSAILABLE AND TAKEN ARE OPPOSITE GOALS - ASK WHICH ONE IS WANTED"
rule = '''Before drafting anything aimed at an adversary, ask whether the object is to be
UNASSAILABLE or to be TAKEN. They call for opposite drafting. Defensive precision closes the opening
the whole instrument depends on. A line nobody can quarrel with is a line nobody answers, and a
document titled so it cannot be criticized is a document that will be ignored.'''
mechanism = '''When Cowork is about to make something more precise, more neutral, or more
correction-proof, stop and ask: is this meant to survive attack, or to invite a response we want? If
the latter, the imprecision IS the mechanism. Leave it.'''

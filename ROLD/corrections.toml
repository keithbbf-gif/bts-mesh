deposition carry-in document to TIMELINE - neutral and therefore ignorable - when the object was to
be demanded by opposing counsel. Keith supplied IMPORTANT: Abraxas Case notes for the Plaintiff,
which a defense lawyer cannot walk past. (2) Keith wrote the closing line Sixty payments. Never

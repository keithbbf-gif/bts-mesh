owed = "⚠ THIS `measured` DATE IS A HAND-MAINTAINED COPY OF A FACT THE FILESYSTEM ALREADY KNOWS, AND IT ROTTED. It said 2026-07-30 while the monitor was running nightly, so KDash — which correctly renders a reading older than its cadence as RED — showed this monitor RED for thirteen days because of the DATE, not because of the monitor. Third instance tonight of a stale status string driving a red light nobody could clear (see R2 Publish Nightly, BTS Publish Watch). ⇒ THE REAL FIX IS TO STOP COPYING: `writes` names the artifact, so the freshness of THAT FILE is the measurement. A monitor's liveness should be read from its output's mtime, not from a date someone remembered to update. Until bts_kdash_feed does that, this line needs touching by hand every time — which is exactly why it will rot again. ✅ Verified running 2026-08-12 02:57: exit 0, wrote RAIL_HEALTH_2026-08-12.md and the ODX copy, and its DRIVE HEALTH row correctly adopted the elevated reading (5.2 h old) instead of publishing its own blind UNKNOWN."


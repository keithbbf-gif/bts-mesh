conf = "V"
measured = 2026-08-12
owed = "🔴 PLM-37. THE MOST LOAD-BEARING MONITOR IN THE MESH AND IT WAS NOT IN THIS REGISTRY. It closed PLM-25 on 2026-08-11 and became load-bearing the same day: fourteen jobs in one session, and EVERY verification of that session's fixes ran through it. MEASURED 2026-08-12: ran to 23:32, then 43 minutes with two jobs sitting unclaimed; woke 00:15, cleared both, stalled again by 00:21; ran again 00:53. ⚠ INTERMITTENT, NOT DEAD — AND THAT IS THE WORSE FAILURE, because one missed tick is indistinguishable from a healthy idle runner and passes any check that asks 'did it run today.' 🔴 ITS LIVENESS CANNOT BE MEASURED FROM ITS LEDGER: the ledger is written ONLY when a job runs, so silence means 'idle' and 'dead' identically. THE SIGNAL IS QUEUED-AND-UNCLAIMED — work in the queue root with nothing in running\\ — and it costs one stat call, needs neither the scheduler nor the runner, and therefore still works when the runner is the thing that is broken. Implemented: bts_mesh\\runner_doctor.py --check (grace 180 s = three ticks). OWED: wire it into rail_check so the stall reports itself. ⚠ CAUSE NOT MEASURED — probably machine idle after midnight, possibly a task condition (battery / idle / run-only-when-logged-on). DO NOT RECORD A CAUSE until the task's own conditions have been read; guessing a systemic cause is the bts_drive_health 'this bridge does not pass SMART through' error that was wrong for 6 of 6 disks."


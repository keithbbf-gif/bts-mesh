#===============================================================================================
# rails.toml — THE INFRASTRUCTURE CONSTANTS. MACHINE-CONSUMED. READ THIS DIRECTLY.
#
# Keith, 2026-07-31: "We are building an OS, not writing a story. AI can translate the latter into
# the former, but that's not an efficient system to do every time."
#
# 🔴 THERE IS NO GENERATED MARKDOWN TWIN OF THIS FILE, AND THERE MUST NEVER BE ONE.
# The first design generated RAILS.md from this file. GEM tore it down and this repo's own record
# convicted it: `00_TOOLS_INDEX.md` carried the line "Generated from the JSON. Edit the JSON, not
# this page" — AND NO GENERATOR EVER EXISTED. People edited the page, the JSON drifted, and
# bts_identity.py shipped invisible for weeks (SCARS: TOOLS_INDEX drift, 2026-07-16 + 2026-07-28).
# A second representation of the truth is the failure, not the fix.
#
# THE SPLIT IS BY CONSUMER, not by topic and not by mutability (GEM's correction, 2026-07-31):
#   machine-consumed -> structured, read directly : rails.toml · index · routines · registries
#   human-consumed   -> Markdown, untouched       : RULES.md · SCARS.md
# Prior art for exactly this line: IaC vs runbooks · OpenAPI spec vs developer docs · .conf vs man.
#
# CONFIDENCE TAGS ARE PART OF THE SCHEMA, NOT A COMMENT:
#   conf = "V"  measured, with the date it was measured
#   conf = "U"  unverified / inferred / vendor-stated — MUST carry `owed` saying how to settle it
# A value with no date is not a measurement. Anything unreachable is NOT MEASURED, never inferred.
#===============================================================================================


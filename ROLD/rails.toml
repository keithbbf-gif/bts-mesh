why  = "A Cowork task cannot see V: unless the folder is in its connected set, and that set is not a file anyone can edit. That blinded free-tier-allotment-check for seven days."
conf = "V"
measured = 2026-08-12
reconfirmed = "2026-08-12, and not by re-reading the rule — by living inside it for a whole session. Every one of ~25 verification jobs ran through the NATIVE queue runner because the Cowork sandbox cannot run a .bat, cannot see V: as a drive letter, caps a call at 45 s, and cannot write a spend ledger across the FUSE mount. When the native runner stalled, ALL native work stopped and nothing in the sandbox could substitute for it — which is the rule stated as a consequence rather than as a policy."
owed = "⚠ AND THE RULE NOW HAS A COROLLARY IT DID NOT HAVE: a native task is a SINGLE POINT OF FAILURE with no fallback, because the sandbox genuinely cannot stand in. `BTS Queue Runner` stalling for 43 minutes stopped every native job in the mesh. ⇒ Anything routed to a native task inherits that task's liveness, so the task itself must be monitored — see [[monitor]] 'BTS Queue Runner' and PLM-37."

#--- SANDBOX LIMITS: measured, and they shape every design ------------------------------------
[sandbox]
background_jobs = false
background_jobs_note = "🔴 MEASURED 2026-07-31: each bash invocation is its OWN container. A nohup/& process DIES with the call that launched it — two node calls sat at RUNNING with no result and no error. Long work must run INSIDE one <=45 s call, or on the desktop. This bounds Rule 2 (\"background, no intervention\") more tightly than the rule assumes."
windows_path_literals = '🔴 A hardcoded Windows absolute path used from the sandbox DOES NOT FAIL — os.makedirs creates a directory whose NAME is the whole literal, drive letter and backslashes included. Two such directories sit inside BTS_MESH, one dated 07-26 (S-101). Route every absolute path through bts_paths. Tell: a directory name containing a colon or a backslash.'
bash_timeout_ms = 45000
background_survives_between_calls = false
mount_corrupts_reads = true
conf = "V"
measured = 2026-07-30
owed = "Guard: Ai\\BTS_MESH\\bts_deadline.py writes RED-TIMED OUT rather than leaving an empty file. Long work runs natively in CoW or as a scheduled task."

